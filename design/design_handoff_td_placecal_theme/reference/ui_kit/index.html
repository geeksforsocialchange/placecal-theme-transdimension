<style>
html,body{margin:0}body{overflow-x:clip}
.td-main{position:relative;isolation:isolate;box-sizing:border-box;max-width:1186px;margin:0 auto 240px;padding:0 24px}
@media(min-width:1500px){.td-main{margin-bottom:250px}}
.td-band{position:absolute;left:50%;transform:translateX(-50%);width:100vw;max-width:1920px;pointer-events:none;z-index:-1;background-repeat:no-repeat;background-position:center top}
.td-band--header{top:-100px;height:499px;background-image:url(../../assets/illustrations/1366px/generic_header.png);background-size:1366px}
.td-band--about{background-image:url(../../assets/illustrations/1366px/about_1_header.png);height:700px}
.td-band--footer{bottom:-200px;height:280px;background-image:url(../../assets/illustrations/1366px/generic_footer.png);background-size:1366px}
.td-home-band{position:absolute;left:50%;transform:translateX(-50%);width:100vw;max-width:1920px;pointer-events:none;z-index:-1;background-repeat:no-repeat;background-position:center;background-size:1366px auto}
.td-grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:0 28px}
.td-grid2>article:nth-child(-n+2){margin-top:0!important}
@media(min-width:900px){.td-grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.td-grid3{display:grid;grid-template-columns:minmax(0,1fr);gap:2.5rem}
@media(min-width:900px){.td-grid3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.td-prose{max-width:560px;margin:0 auto}
.td-prose p{font-size:1rem;line-height:1.75}
