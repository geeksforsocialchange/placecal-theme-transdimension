# The whole configuration comes from core, which owns it for every extension:
# see the header of PlaceCal's config/rubocop/extension.yml, and "Continuous
# integration" in its doc/extensions.md. Core is always beside this checkout:
# the reusable workflow checks it out at ./PlaceCal, and locally RuboCop runs
# with BUNDLE_GEMFILE pointed at a core checkout anyway.
inherit_from: ../PlaceCal/config/rubocop/extension.yml
