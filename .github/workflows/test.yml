name: Test

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      placecal_ref:
        description: "Ref of geeksforsocialchange/PlaceCal to build against"
        required: false
        default: "feature/td-extension"

env:
  # The core branch this engine is built against. Switch to "main" once the
  # core extension PR (#3368) is merged.
  PLACECAL_REF: ${{ github.event.inputs.placecal_ref || 'feature/td-extension' }}

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: placecal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/placecal_test
      PLACECAL_CORE_PATH: ${{ github.workspace }}/PlaceCal
      BUNDLE_GEMFILE: ${{ github.workspace }}/PlaceCal/Gemfile

    steps:
      - name: Checkout the theme engine
        uses: actions/checkout@v4
        with:
          path: theme

      - name: Checkout PlaceCal core
        uses: actions/checkout@v4
        with:
          repository: geeksforsocialchange/PlaceCal
          ref: ${{ env.PLACECAL_REF }}
          path: PlaceCal

      # Core's image processing needs libvips at boot, the same as core's own CI
      - name: Install libvips
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev

      - name: Read core's Ruby version
        id: ruby
        run: echo "version=$(cat PlaceCal/.ruby-version)" >> "$GITHUB_OUTPUT"

      - name: Set up Ruby (version from core's .ruby-version)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ steps.ruby.outputs.version }}
          bundler-cache: true
          working-directory: PlaceCal

      # The request specs render core's layout, which links core's built CSS,
      # so core's assets have to be built the way core's own CI builds them.
      - name: Set up Node for core
        uses: actions/setup-node@v4
        with:
          node-version-file: PlaceCal/.node-version
          cache: yarn
          cache-dependency-path: PlaceCal/yarn.lock

      - name: Install core JS dependencies
        working-directory: PlaceCal
        run: yarn install --frozen-lockfile

      - name: Build core assets
        working-directory: PlaceCal
        run: |
          bin/yarn run build:all
          bin/rails dartsass:build

      # A PlaceCal installation pins this engine by tag, so a tag that disagrees
      # with VERSION would ship a build claiming a version it is not. No-op on
      # branch pushes and pull requests.
      - name: Fail if a pushed tag disagrees with VERSION
        working-directory: theme
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "Not a tag push, nothing to check."
            exit 0
          fi
          version=$(ruby -e 'require "./lib/transdimension/version"; print Transdimension::VERSION')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version (expected v$version)."
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME matches VERSION $version."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: theme/package.json
          cache: yarn
          cache-dependency-path: theme/yarn.lock

      - name: Install JS dependencies
        working-directory: theme
        run: yarn install --frozen-lockfile

      - name: Fail if the committed Tailwind build is stale
        working-directory: theme
        run: yarn run check

      - name: RuboCop
        working-directory: theme
        run: bundle exec rubocop

      - name: Prepare core's test database
        working-directory: PlaceCal
        run: bin/rails db:schema:load

      - name: RSpec
        working-directory: theme
        run: bundle exec rspec
