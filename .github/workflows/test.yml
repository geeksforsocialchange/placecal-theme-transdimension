name: Test

# Core owns the whole job: check out both repos, point core's bundle at this
# checkout, build core's assets, then run this engine's RuboCop and specs. See
# "Continuous integration" in PlaceCal's doc/extensions.md.
#
# A reusable workflow is resolved at the ref the caller names, so the `uses:`
# ref and `placecal_ref` have to name the same thing.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  # Nightly against core main, so a core change that breaks this theme shows up the next morning.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  test:
    uses: geeksforsocialchange/PlaceCal/.github/workflows/extension-test.yml@main
    with:
      engine: placecal-theme-transdimension
      module_dir: transdimension
      chrome: true
      placecal_ref: main

  # Merging a VERSION bump to green main tags it and publishes the release; core opens the pin PR.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Two main runs finishing together would both see no tag and both try to create it.
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Release VERSION if it has no tag yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(sed -nE "s/.*VERSION = '([0-9]+\.[0-9]+\.[0-9]+)'.*/\1/p" lib/transdimension/version.rb)
          [ -n "$version" ] || { echo "No VERSION in lib/transdimension/version.rb"; exit 1; }
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
            exit 0
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "v$version" --generate-notes
