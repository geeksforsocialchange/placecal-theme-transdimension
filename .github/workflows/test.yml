name: Test

# Core owns the whole job: check out both repos, point core's bundle at this
# checkout, build core's assets, then run this engine's RuboCop and specs. See
# "Continuous integration" in PlaceCal's doc/extensions.md.
#
# A reusable workflow is resolved at the ref the caller names, so the `uses:`
# ref and `placecal_ref` have to name the same thing. Both are the core branch
# carrying the extension scaffold; switch both to `main` once PlaceCal #3436 is
# merged.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    uses: geeksforsocialchange/PlaceCal/.github/workflows/extension-test.yml@feature/td-extension
    with:
      engine: placecal-theme-transdimension
      module_dir: transdimension
      chrome: true
      placecal_ref: feature/td-extension
