# Core string overrides for sites on the transdimension theme only. Core's
# PlaceCal::ThemeTranslation looks up theme_overrides.<theme>.<key> before
# <key> for the current site's theme, so nothing here leaks to other sites.
en:
  theme_overrides:
    transdimension:
      # Kim (2026-09-03): TD's wording for the footer link (the main nav has none)
      navigation:
        site:
          join: "Join us"
      region_filter:
        all: "Everywhere"
      # Listing page titles and intro panels (the hero standfirst slot, #3368
      # D1). Copy is TD's own, from transdimension.* below: the title sits on
      # the starfield and the standfirst becomes the pink intro panel.
      # Paginator.elm labels the day buttons "Fri 04 Sep" and calls the
      # unfiltered listing "Future events" (core keys: filters.day_strip.*).
      filters:
        day_strip:
          # Final design (screens/02-events-index-full.png): the day buttons
          # read "Wed 9", not "Wed 09 Sep" (which truncated to "Wed 09 S..."
          # at the button's equal-share width). Only the strip reads this key;
          # Components::Timeline draws its own duplicate row from a format
          # core keeps to itself, and the event page date uses events.page /
          # events.card below.
          date_format: "%a %-d"
          all_upcoming: "Future events"
        # Partners index (README §4): Components::Filter's toggle button has
        # no separate label/value slot, so this text is both the idle caption
        # and, once chosen, the selected item's name (see partners.css).
        category: "Type"
        neighbourhood: "Location"
        # Events index (README §2): FilterToggle.jsx's "FILTER EVENTS" toggle
        # is core's "Filter and sort" button (events.css styles it centred,
        # allcaps, with the pink +/-). There is no separate "Pick a date"
        # toggle for a day-strip theme (doc/core-slots-needed.md).
        filter_and_sort: "Filter events"
      events:
        index:
          title: "Events"
          page_title: "Events"
          # Final design (README §2): "Events & activities upcoming in your
          # area." The region-aware variant ("...in London.") is a core slot
          # (doc/core-slots-needed.md): core's standfirst key has no
          # interpolation token for the selected region.
          standfirst: "Events & activities upcoming in your area."
          # No list_heading: Events.elm has no heading between the intro panel
          # and the filters, and core ships the key blank, so overriding it
          # would put a heading in the page that the theme then has to hide.
          # Final design (screens/02-events-index-full.png): the button under
          # the box reads "Subscribe with iCal", not core's site-name form;
          # core interpolates %{name}, so a value with no token is fine.
          subscribe_ical: "Subscribe with iCal"
        # Events.elm prints the day zero-padded ("02") over an uppercase month,
        # and prefixes the organiser with "by".
        # Event.elm: section name above the title panel (final design hides it
        # on the page itself, see event-show.css, but the string stays for
        # any other surface that reads it). Final design's page date reads
        # "07 SEP 2026": zero-padded day, short month, uppercased by CSS.
        show:
          section: "Events"
        page:
          date_format: "%d %b %Y"
          date_format_with_year: "%d %b %Y"
        card:
          date_format: "%d %b"
          date_format_with_year: "%d %b %Y"
          organiser_prefix: "By "
      partners:
        show:
          section: "Partners"
        index:
          title: "Partners"
          page_title: "Partners"
          # Final design (README §4): one line only, no standfirst_detail.
          standfirst: "We are proud to partner with a number of charities and organisations with a long track record of supporting the trans community."
          standfirst_detail: ""
          # Partners.elm: heading between the intro panel and the list
          list_heading: "All partners"
      news:
        show:
          section: "News"
          # Final design (screens/07-article-show-full.png): the button under
          # the box reads "Go back", not core's "Back to news".
          back: "Go back"
          # Ruby's strftime has no ordinal token, so the "14th January 2025"
          # form in the design (reference/ui_kit/data.jsx.txt) is a core slot;
          # this is the closest match without it.
          date_format: "%-d %B %Y"
        index:
          # News.elm card: "Read the rest" button, day-month-year byline
          read_more: "Read the rest"
          date_format: "%-d %B %Y"
          title: "News"
          page_title: "News"
          # Final design (screens/06-news-index-full.png): "Older news", not
          # core's "Older news items".
          older: "Older news"
          standfirst: "Updates & articles from The Trans Dimension."
      # JoinUs.elm: the intro panel copy (the form fields are PlaceCal's, D8)
      sites:
        join:
          intro: "Want to be listed on The Trans Dimension? Get in touch and learn how you can create space and spaces for us."
