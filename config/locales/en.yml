# Strings the theme owns outright, namespaced under transdimension.*: its own
# footer, its own homepage and the copy its own static page views render.
#
# Copy that replaces a core string for this theme lives in overrides.en.yml
# instead (theme_overrides.transdimension.*), so nothing here duplicates a core
# key. Every key below is read by app/ or lib/, which spec/i18n_spec.rb
# enforces: the six reached only through an interpolated t() call
# (footer.<name>_link, footer.<name>_alt, footer.credit_<n>_*) are matched as
# patterns, so an orphaned key fails the suite.
en:
  transdimension:
    # Site-level and global strings
    site:
      title: The Trans Dimension
      description: "The Trans Dimension is an online community hub connecting trans communities in London and Manchester. We collate news, events and services by and for trans people."
    external:
      gfsc_home: "https://gfsc.studio/"
      gendered_intelligence_home: "https://genderedintelligence.co.uk/"
      gendered_intelligence_name: "Gendered Intelligence"
    # Nav labels for the theme's own pages, read by the page registrations in
    # Transdimension::Engine.
    nav:
      about: "About"
    # Header
    header:
      donate: "Donate"
    # Footer
    footer:
      social: "Follow us out there"
      insta_link: "https://www.instagram.com/genderedintelligence/"
      twitter_link: "https://twitter.com/genderintell"
      facebook_link: "https://www.facebook.com/GenderedIntelligence"
      # Alt text for the icon and logo links. The Elm site draws these as inline
      # SVG with an aria-label; here they are <img> tags, so they need alt.
      insta_alt: "The Trans Dimension on Instagram"
      twitter_alt: "The Trans Dimension on Twitter"
      facebook_alt: "The Trans Dimension on Facebook"
      gfsc_alt: "Geeks for Social Change"
      byline: "Created by"
      info_title: "The Trans Dimension, c/o Gendered Intelligence"
      info_charity: "Gendered Intelligence is a Registered Charity in England and Wales No. 1182558."
      info_company: "Registered as a Company Limited by Guarantee in England and Wales No. 06617608."
      info_office: "Registered office at VAI, 200a Pentonville Road, London N1 9JP."
      credit_title: "Credits"
      credit_1_text: "Illustrations by"
      credit_1_name: "Harry Woodgate"
      credit_1_link: "https://www.harrywoodgate.com/"
      credit_2_text: "design by"
      credit_2_name: "Squid"
      credit_2_link: "https://studiosquid.co.uk/"
      credit_3_text: "website by"
      credit_3_name: "GFSC"
      credit_3_link: "https://gfsc.studio/"
      copyright: "© %{year} Gendered Intelligence. All rights reserved."
      powered_by: "Powered by PlaceCal"
    # Home/Index page
    home:
      # Copy is the Elm site's, verbatim from src/Copy/Text.elm. The apostrophes
      # and the "&" in the logo alt text are theirs.
      meta_title: Home
      meta_description: An online community hub which will connect trans communities across the UK by collating news, events and services by and for trans people in one easy-to-reach place. A collaboration between Gendered Intelligence and Geeks for Social Change.
      logo_alt: The Trans Dimension, Space and spaces for us
      intro_title: Trusted, accessible, trans-friendly spaces. Always expanding.
      intro_message: The Trans Dimension is an online community hub connecting trans communities in London and Manchester. We collate news, events and services by and for trans people.
      intro_button: See what's on
      events_header: Upcoming Events
      events_button: View all events
      events_empty: There are no upcoming events. Check back for updates!
      news_header: Latest news
      news_button: View all news
      news_read_more: Read the rest
    # About page. The section headings are rendered by
    # Transdimension::Views::About, in the order About.elm renders them.
    about:
      title: "About"
      accessibility: "Our Accessibility Process"
      makers: "Meet the Makers"
      gi: "Gendered Intelligence"
      gfsc: "Geeks for Social Change"
      placecal: "Built using PlaceCal"
    # Privacy page, rendered by Transdimension::Views::Privacy
    privacy:
      title: "Privacy Policy"
      subtitle: "The Trans Dimension is committed to protecting your privacy online."
